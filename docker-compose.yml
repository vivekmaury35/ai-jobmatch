services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: jobmatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
